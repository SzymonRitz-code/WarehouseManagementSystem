services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Wms_dev_password123!"
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  idp:
    build:
      context: .
      dockerfile: WarehouseManagementSystem.Idp/Dockerfile
    container_name: wms-idp
    environment:
      # Port 8090 accepts Docker Desktop's HTTP link and redirects to TLS on 8091.
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_HTTPS_PORT: "8091"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/localhost.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "wms-local-dev"
      IdentityServer__IssuerUri: "https://localhost:8091"
    ports:
      - "8090:8080"
      - "8091:8443"
    volumes:
      # Use the host-trusted localhost certificate instead of generating one per image.
      - ./.certs/localhost.pfx:/https/localhost.pfx:ro

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: wms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: WarehouseManagementSystem.API/Dockerfile
    container_name: wms-api
    depends_on:
      sqlserver:
        condition: service_healthy
      idp:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Kestrel listens on both protocols so the published HTTP port can redirect to HTTPS.
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_HTTPS_PORT: "8081"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/localhost.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "wms-local-dev"
      ConnectionStrings__WarehouseManagementSystemConnection: "Server=sqlserver,1433;Database=WarehouseDb;User Id=sa;Password=Wms_dev_password123!;TrustServerCertificate=True;"
      Authentication__Authority: "https://idp:8443"
      Authentication__MetadataAddress: "https://idp:8443/.well-known/openid-configuration"
      # Tokens are issued for the browser-visible IDP address, not its Docker DNS name.
      Authentication__ValidIssuer: "https://localhost:8091"
      Authentication__Audience: "wmsApi"
      Authentication__RequireHttpsMetadata: "true"
      # The SQL Server container uses its own persistent volume, so a fresh Docker
      # deployment must initialize that database instead of assuming the host DB.
      Database__MigrateOnStartup: "true"
      Seeding__Enabled: "true"
      Seeding__Profile: "Extreme"
      RedisCache__Enabled: "true"
      RedisCache__ConnectionString: "redis:6379"
      RedisCache__InstancePrefix: "wms"
      RedisCache__DefaultTtlMinutes: "15"
      RedisCache__NegativeTtlSeconds: "30"
      RedisCache__TtlJitterSeconds: "30"
      RedisCache__ConnectTimeoutMs: "2000"
      RedisCache__OperationTimeoutMs: "1500"
      Messaging__Enabled: "true"
      Messaging__PublishBatchSize: "20"
      Messaging__PublishPollIntervalSeconds: "5"
      Messaging__PublishConfirmTimeoutSeconds: "10"
      Messaging__RabbitMq__HostName: "rabbitmq"
      Messaging__RabbitMq__Port: "5672"
      Messaging__RabbitMq__UserName: "guest"
      Messaging__RabbitMq__Password: "guest"
      Messaging__RabbitMq__VirtualHost: "/"
    ports:
      - "8080:8080"
      - "8081:8443"
    volumes:
      - ./.certs/localhost.pfx:/https/localhost.pfx:ro

  fake-shipping:
    build:
      context: .
      dockerfile: WarehouseManagementSystem.FakeShipping/Dockerfile
    container_name: wms-fake-shipping
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Shipping: "Data Source=/app/data/fake-shipping.db"
      ShippingMessaging__HostName: "rabbitmq"
      ShippingMessaging__Port: "5672"
      ShippingMessaging__UserName: "guest"
      ShippingMessaging__Password: "guest"
    volumes:
      - shipping-data:/app/data

  fake-billing:
    build:
      context: .
      dockerfile: WarehouseManagementSystem.FakeBilling/Dockerfile
    container_name: wms-fake-billing
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Billing: "Data Source=/app/data/fake-billing.db"
      BillingMessaging__HostName: "rabbitmq"
      BillingMessaging__Port: "5672"
      BillingMessaging__UserName: "guest"
      BillingMessaging__Password: "guest"
    volumes:
      - billing-data:/app/data

  client:
    build:
      context: WarehouseManagementSystemClient
      dockerfile: Dockerfile
    container_name: wms-client
    depends_on:
      api:
        condition: service_started
      idp:
        condition: service_started
    ports:
      - "4200:80"
      - "4201:443"
    volumes:
      # PEM files come from the same trusted development certificate used by Kestrel.
      - ./.certs/localhost.pem:/etc/nginx/certs/localhost.crt:ro
      - ./.certs/localhost.key:/etc/nginx/certs/localhost.key:ro

volumes:
  sqlserver-data:
  shipping-data:
  billing-data:
