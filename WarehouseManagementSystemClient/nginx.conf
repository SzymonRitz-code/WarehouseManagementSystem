server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Docker Desktop opens published ports with HTTP, so keep a redirect-only endpoint.
    return 308 https://localhost:4201$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Angular routes are handled by the SPA after index.html is loaded.
        try_files $uri $uri/ /index.html;
    }
}
