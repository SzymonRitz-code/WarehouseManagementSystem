<div class="flex justify-between mt-6">
    <button (click)="back.emit()" class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-100 transition">
        {{ backLabel }}
    </button>

    <button (click)="action.emit()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
        {{ actionLabel }}
    </button>
</div>
