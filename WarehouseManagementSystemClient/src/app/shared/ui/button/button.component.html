<button
  [type]="type()"
  [ngClass]="
    'inline-flex items-center justify-center gap-2 rounded-lg transition ' +
    className() + ' ' +
    sizeClasses() + ' ' +
    variantClasses() + ' ' +
    disabledClasses()
  "
  [disabled]="disabled()"
  (click)="onClick($event)"
>
  @if (startIcon(); as startIconValue) {
  <span class="flex items-center" [innerHTML]="startIconValue | safeHtml"></span>
  }
  <ng-content></ng-content>
  @if (endIcon(); as endIconValue) {
  <span class="flex items-center" [innerHTML]="endIconValue | safeHtml"></span>
  }
</button>
