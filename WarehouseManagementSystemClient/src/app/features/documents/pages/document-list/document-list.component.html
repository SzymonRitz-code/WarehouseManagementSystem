<div>
    <app-page-breadcrumb pageTitle="Document List" />

    <app-component-card title="Document List">
        <button card-actions (click)="goToForm()"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Add Document
        </button>

        <form class="mb-4 grid gap-3 md:grid-cols-2 xl:grid-cols-6" (ngSubmit)="applyFilters()">
            <input
                type="search"
                name="search"
                [(ngModel)]="filters.search"
                placeholder="Search number or user"
                class="rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white" />

            <select
                name="type"
                [(ngModel)]="filters.type"
                class="rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white">
                <option value="">All types</option>
                <option *ngFor="let type of documentTypes" [value]="type">{{ type }}</option>
            </select>

            <select
                name="status"
                [(ngModel)]="filters.status"
                class="rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white">
                <option value="">All statuses</option>
                <option *ngFor="let status of documentStatuses" [value]="status">{{ status }}</option>
            </select>

            <select
                name="warehouseId"
                [(ngModel)]="filters.warehouseId"
                class="rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white">
                <option value="">All warehouses</option>
                <option *ngFor="let warehouse of warehouses$ | async" [value]="warehouse.id">
                    {{ warehouse.code }} - {{ warehouse.name }}
                </option>
            </select>

            <input
                type="date"
                name="createdFrom"
                [(ngModel)]="filters.createdFrom"
                class="rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white" />

            <input
                type="date"
                name="createdTo"
                [(ngModel)]="filters.createdTo"
                class="rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-white" />

            <div class="flex gap-2 md:col-span-2 xl:col-span-6">
                <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700">
                    Apply filters
                </button>
                <button type="button" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-gray-800" (click)="resetFilters()">
                    Reset
                </button>
            </div>
        </form>

        <div *ngIf="isLoading" class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400">
            Loading documents...
        </div>
        <div *ngIf="errorMessage" class="mb-3 rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-700 dark:border-error-900/40 dark:bg-error-950/30 dark:text-error-300">
            <span>{{ errorMessage }}</span>
            <button type="button" class="ml-3 underline" (click)="retry()">Retry</button>
        </div>

        <div class="overflow-hidden rounded-xl border border-gray-200 bg-white dark:border-white/[0.05] dark:bg-white/[0.03]">
            <app-table
                [columns]="columns"
                [data]="documents$ | async"
                [pageSize]="pageSize"
                [currentPage]="page"
                [totalItems]="totalItems"
                [serverSide]="true"
                [filterable]="false"
                [rowActions]="documentActions"
                (pageChange)="onPageChange($event)"
                (pageSizeChange)="onPageSizeChange($event)"
                (sortChange)="onSortChange($event)"
                (rowAction)="onDocumentAction($event)">
            </app-table>
        </div>
    </app-component-card>
</div>
