<div>
    <app-page-breadcrumb pageTitle="Document List" />

    <app-component-card title="Document List">
        <app-button card-actions size="sm" (btnClick)="goToForm()">
            Add Document
        </app-button>

        <form class="mb-4 grid gap-3 md:grid-cols-2 xl:grid-cols-6" (ngSubmit)="applyFilters()">
            <input
                type="search"
                name="search"
                [(ngModel)]="filters.search"
                placeholder="Search number or user"
                class="ui-control" />

            <select
                name="type"
                [(ngModel)]="filters.type"
                class="ui-control">
                <option value="">All types</option>
                <option *ngFor="let type of documentTypes" [value]="type">{{ type }}</option>
            </select>

            <select
                name="status"
                [(ngModel)]="filters.status"
                class="ui-control">
                <option value="">All statuses</option>
                <option *ngFor="let status of documentStatuses" [value]="status">{{ status }}</option>
            </select>

            <select
                name="warehouseId"
                [(ngModel)]="filters.warehouseId"
                class="ui-control">
                <option value="">All warehouses</option>
                <option *ngFor="let warehouse of warehouses$ | async" [value]="warehouse.id">
                    {{ warehouse.code }} - {{ warehouse.name }}
                </option>
            </select>

            <input
                type="date"
                name="createdFrom"
                [(ngModel)]="filters.createdFrom"
                class="ui-control" />

            <input
                type="date"
                name="createdTo"
                [(ngModel)]="filters.createdTo"
                class="ui-control" />

            <div class="flex gap-2 md:col-span-2 xl:col-span-6">
                <app-button type="submit" size="sm">
                    Apply filters
                </app-button>
                <app-button variant="outline" size="sm" (btnClick)="resetFilters()">
                    Reset
                </app-button>
            </div>
        </form>

        <div *ngIf="isLoading()" class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400">
            Loading documents...
        </div>
        <div *ngIf="errorMessage()" class="mb-3 rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-700 dark:border-error-900/40 dark:bg-error-950/30 dark:text-error-300">
            <span>{{ errorMessage() }}</span>
            <button type="button" class="ml-3 underline" (click)="retry()">Retry</button>
        </div>

        <app-table
            [columns]="columns"
            [data]="documents$ | async"
            [pageSize]="pageSize()"
            [currentPage]="page()"
            [totalItems]="totalItems()"
            [serverSide]="true"
            [filterable]="false"
            [rowActions]="documentActions"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onDocumentAction($event)">
        </app-table>
    </app-component-card>
</div>
