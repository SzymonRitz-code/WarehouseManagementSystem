<div>
    <app-page-breadcrumb pageTitle="User List" />

    <app-component-card title="User List">
        <div *ngIf="isLoading" class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400">
            Loading users...
        </div>
        <div *ngIf="errorMessage" class="mb-3 rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-700 dark:border-error-900/40 dark:bg-error-950/30 dark:text-error-300">
            <span>{{ errorMessage }}</span>
            <button type="button" class="ml-3 underline" (click)="retry()">Retry</button>
        </div>
        <app-table 
            [columns]="columns" 
            [data]="users$ | async" 
            [pageSize]="5"                
            [rowActions]="userActions"
            (rowAction)="onUserAction($event)">
        </app-table>
    </app-component-card>
</div>
